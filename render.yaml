# Render Blueprint — deploys the backend and frontend as two separate
# services from this one monorepo. See README.md "Deploying to Render" for
# the manual (non-Blueprint) alternative and important notes about
# VITE_API_URL below.
#
# After the backend service is created, confirm its actual public URL in the
# Render dashboard (it's only guaranteed to match the name below if that name
# isn't already taken by someone else on Render) and update the frontend's
# VITE_API_URL env var to match if it differs — then redeploy the frontend.

services:
  - type: web
    name: workflow-builder-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set this yourself in the Render dashboard — never committed
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  - type: web
    name: workflow-builder-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://workflow-builder-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
